add_header Content-Security-Policy "default-src 'self'; script-src 'self' __UMAMI__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://usosapi.zut.edu.pl https://fonts.googleapis.com https://fonts.gstatic.com __UMAMI__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
